name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_asset_count.outputs.should_run }}

    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          registry-url: https://npm.pkg.github.com
          scope: "@seenivers"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0

      - name: Install dependencies
        run: pnpm install

      - name: Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: pnpm exec semantic-release

      - name: Save Release Details
        id: log_release_details
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view --json tagName,body,id,isDraft,isPrerelease,assets > "${RUNNER_TEMP}/release.json"

          jq '{
            tag_name: .tagName,
            id: (.id | tostring),
            body: .body,
            prerelease: .isPrerelease,
            draft: .isDraft
          }' "${RUNNER_TEMP}/release.json" > release_info.json

          asset_count=$(jq '.assets | length' "${RUNNER_TEMP}/release.json")
          echo "asset_count=${asset_count}" >> "$GITHUB_ENV"

      - name: Upload Release Details
        uses: actions/upload-artifact@v7
        with:
          name: release-info
          path: release_info.json

      - name: Check Asset Count
        id: check_asset_count
        shell: bash
        run: |
          if [[ $asset_count -gt 3 ]]; then
            echo "More than 3 assets found. Skipping Tauri Release. (${asset_count})"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Update Cargo.toml version
        id: update_version
        shell: bash
        run: |
          TAG=$(jq -r '.tag_name' release_info.json)
          VERSION=${TAG#v}

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' src-tauri/Cargo.toml

      - name: Commit updated Cargo.toml
        shell: bash
        run: |
          VERSION="${{ steps.update_version.outputs.version }}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add src-tauri/Cargo.toml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update application version to $VERSION"
            git push
          fi

  format:
    name: Code Formatting
    needs: semantic-release

    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/format.yml

  tauri-release:
    name: Tauri Release
    needs: format
    if: needs.semantic-release.outputs.should_run == 'true'

    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: 'macos-latest'
          #   args: '--target aarch64-apple-darwin'
          # - platform: 'macos-latest'
          #   args: '--target x86_64-apple-darwin'
          # - platform: 'ubuntu-22.04'
          #   args: ''
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Download Release Details
        uses: actions/download-artifact@v8
        with:
          name: release-info

      - name: Read Release Details
        id: read_release_details
        shell: bash
        run: |
          tag_name=$(jq -r '.tag_name' release_info.json)
          release_details=$(jq -c --arg release_name "App ${tag_name}" '{
            tag_name: .tag_name,
            release_name: $release_name,
            release_body: .body,
            release_id: .id,
            release_draft: .draft,
            prerelease: .prerelease
          }' release_info.json)

          echo "release_details=${release_details}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          registry-url: https://npm.pkg.github.com
          scope: "@seenivers"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.10.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Import Windows certificate
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -Exportable -FilePath "cert.pfx" -CertStoreLocation 'cert:\CurrentUser\My' -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ fromJson(env.release_details).tag_name }}
          releaseName: ${{ fromJson(env.release_details).release_name }}
          releaseBody: ${{ fromJson(env.release_details).release_body }}
          releaseId: ${{ fromJson(env.release_details).release_id }}
          releaseDraft: ${{ fromJson(env.release_details).release_draft }}
          prerelease: ${{ fromJson(env.release_details).prerelease }}
          args: ${{ matrix.args }}
